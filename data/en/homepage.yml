############################# problem ################################
problem:
  enable : true
  title_outline : "THE PROBLEM"
  title : "A long paper is no longer evidence that work was done"
  content : "With the rise of LLMs, producing text is free. Producing numbers that somebody else can reproduce is not.
    <br><br>
    ecoCompute has shown that a *show me the numbers* culture works in practice. What is missing is a peer-reviewed venue that holds research to the same standard: one where the reviewers run the thing.
    <br><br>
    The scope is **resource aware and resource reducing computing**: energy, carbon, hardware lifetime, memory, bandwidth, and the methods used to measure and account for all of them."

######################### what is different #########################
different:
  enable : true
  title : "Three things we do differently"
  subtitle : "The venue is built around the artifact, not around the write-up."
  items:

    - name : "1. Artifact first"
      icon : "tf-ion-cube"
      bg_color : "coal"
      content : |
        Every submission ships a complete, runnable artifact. A ZIP file or a container image is fine, no hosting platform is required.
        <br><br>
        What is required is a precise, step-by-step guide that lets a reviewer regenerate the numbers without asking the authors for help.

    - name : "2. Two pages, bullet points welcome"
      icon : "tf-ion-android-document"
      bg_color : "karmin"
      content : |
        The write-up is a map to the artifact, not the evidence itself. At most two pages: what you want to show, how you showed it, what the results are, prior work, what you want to discuss.
        <br><br>
        Good bullet points are entirely acceptable. Prose is not rewarded.

    - name : "3. No talks"
      icon : "tf-ion-chatbubbles"
      bg_color : "turquoise"
      content : |
        The event is discussion only, adapted from the session format used at ICT4S.
        <br><br>
        Nobody presents slides to a silent room. Every accepted submission is discussed three times, with a different group each time.

######################### measurement note #########################
measurement:
  enable : true
  title : "Energy and carbon measurements are not bit-reproducible. We deal with that explicitly."
  content : "Authors state what is supposed to be stable, an ordering, a direction, an effect size, and within what tolerance. They report the variance of their own runs rather than a single mean.
    <br><br>
    A reviewer who reproduces the ordering but not the absolute numbers has reproduced the claim, provided the claim was stated that way in the first place."
  button:
    enable : true
    label : "Artifact requirements"
    link : "/artifacts"

######################### especially wanted #########################
wanted:
  enable : true
  title_outline : "WELCOME"
  title : "What we especially want to see"
  items:
    - title : "Negative results"
      content : "The measurement did not show what you expected. The optimisation did not pay off. The effect disappeared once you controlled for the noise. An artifact-centred venue is the natural home for this."

    - title : "Replication studies"
      content : "We tried to reproduce X and could not, or we did and here is what it took. Both are first-class submissions here, not second-tier filler."

    - title : "Methodology and accounting work"
      content : "A new way to account for oversubscription or effective usage is in scope. The artifact is then the calculation applied to sample setups, which a reviewer can re-run and re-check."

    - title : "Tools and measurement stacks"
      content : "Software that measures, profiles or reduces resource use, with the evidence that it does what it says."

############################## format ##############################
format:
  enable : true
  title_outline : "THE EVENT"
  title : "Online, discussion only, three sessions per paper"
  items:
    - icon : "tf-ion-android-globe"
      title : "Online, European timezone"
      content : "No venue, no travel, no accommodation. The whole event runs online."

    - icon : "tf-ion-android-people"
      title : "Three sessions per paper"
      content : "Each accepted submission gets three discussion sessions. The author takes part in every one of them."

    - icon : "tf-ion-ios-list"
      title : "Register per session"
      content : "Participants sign up for individual sessions in advance. Group size is capped so that everyone can actually speak."

    - icon : "tf-ion-android-document"
      title : "Read before you join"
      content : "The two-pagers circulate a week ahead. Having read them is a condition of taking part in a session."

    - icon : "tf-ion-edit"
      title : "Notes go back to the author"
      content : "Session notes are generated by an LLM, sent to the author, and become input for the full paper."

    - icon : "tf-ion-arrow-graph-up-right"
      title : "A processing step, not a showcase"
      content : "The event sits between the artifact and the publication. It exists to improve the work, not to applaud finished work."

######################### review & publication #########################
review:
  enable : true
  title_outline : "PROCESS"
  title : "Review and publication"
  steps:
    - step : "01"
      title : "Submit"
      content : "Two pages plus a complete, runnable artifact."

    - step : "02"
      title : "Kick the tires"
      content : "The first days of the review period are a setup phase. Reviewers report anything that blocks them from starting, and authors get a short window to fix it. Artifacts should not fail on setup problems."

    - step : "03"
      title : "Artifact evaluation"
      content : "A dedicated artifact evaluation committee runs the submissions. Review outcome and artifact status are published together with the paper."

    - step : "04"
      title : "Stage one: present"
      content : "Accepted two-pagers are discussed at the event, three sessions each."

    - step : "05"
      title : "Stage two: full paper"
      content : "Written after the event and shepherded by a committee member who confirms that the claims did not outgrow the evidence that was actually reviewed. The full paper receives a DOI."
  button:
    enable : true
    label : "Read the full process"
    link : "/review"

