############################# problem ################################
problem:
  enable : true
  title_outline : "MOTIVATION"
  title : "The length of a paper is no longer evidence that the work was done"
  content : "With the general availability of large language models, the human cost of producing text has fallen to near zero while the enviromental cost is rising exponentially. The cost of producing results that another researcher can reproduce has not.
    <br><br>
    The ecoCompute conference has demonstrated that a culture of empirical demonstration is workable in practice. What is missing is a peer-reviewed venue that holds research to the same standard: one in which the reviewers execute the artifact.
    <br><br>
    The scope is **resource-aware and resource-reducing computing**: energy, carbon, hardware lifetime, memory, bandwidth, and the methods used to measure and account for them."

######################### what is different #########################
different:
  enable : true
  title : "Three departures from the conventional format"
  subtitle : "The venue is organised around the artifact rather than around the write-up."
  items:

    - name : "1. Artifact first"
      icon : "tf-ion-cube"
      bg_color : "coal"
      content : |
        Every submission includes a complete, runnable artifact. An archive file or a container image is sufficient; no hosting platform is required.
        <br><br>
        Each artifact must be accompanied by a precise, step-by-step guide that enables a reviewer to regenerate the reported results without consulting the authors.

    - name : "2. Two-page write-up"
      icon : "tf-ion-android-document"
      bg_color : "karmin"
      content : |
        The write-up is a guide to the artifact, not the evidence itself. It is limited to two pages and states the claim, the method, the results, the relation to prior work, and the questions the authors wish to discuss.
        <br><br>
        Bullet points are acceptable throughout. Presentational quality is not a criterion for acceptance.

    - name : "3. No presentations"
      icon : "tf-ion-chatbubbles"
      bg_color : "turquoise"
      content : |
        The event consists entirely of discussion, following the session format used at ICT4S.
        <br><br>
        There are no slide presentations. Each accepted submission is discussed in three separate sessions, with a different group of participants in each.

######################### measurement note #########################
measurement:
  enable : true
  title : "Energy and carbon measurements are not bit-reproducible. The review process accounts for this explicitly."
  content : "Authors state which property of their results is expected to be stable, that is an ordering, a direction or an effect size, and within what tolerance. They report the variance across their own runs rather than a single mean.
    <br><br>
    A reviewer who reproduces the stated ordering but not the absolute values has reproduced the claim, provided the claim was formulated in those terms."
  button:
    enable : true
    label : "Artifact requirements"
    link : "/artifacts"

############################## format ##############################
format:
  enable : true
  title_outline : "THE EVENT"
  title : "Online, discussion only, three sessions per submission"
  items:
    - icon : "tf-ion-android-globe"
      title : "Online"
      content : "The event is held entirely online. There is no venue, and no travel or accommodation is required."

    - icon : "tf-ion-android-people"
      title : "Three sessions per submission"
      content : "Each accepted submission is allocated three discussion sessions. The author participates in all three."

    - icon : "tf-ion-ios-list"
      title : "Registration per session"
      content : "Participants register for individual sessions in advance. Group size is limited so that every participant is able to contribute."

    - icon : "tf-ion-android-document"
      title : "Reading in advance"
      content : "The two-page submissions are circulated one week beforehand. Having read them is a condition of participation in a session."

    - icon : "tf-ion-edit"
      title : "Session notes returned to the author"
      content : "Notes from each session are produced with LLM assistance, sent to the author, and serve as input to the full paper."

    - icon : "tf-ion-arrow-graph-up-right"
      title : "A stage in the process, not a showcase"
      content : "The event is positioned between the artifact and the publication. Its purpose is to improve the work rather than to present completed results."

######################### review & publication #########################
review:
  enable : true
  title_outline : "PROCESS"
  title : "Review and publication"
  steps:
    - step : "01"
      title : "Submission"
      content : "Two pages and a complete, runnable artifact."

    - step : "02"
      title : "Kick-the-tires phase"
      content : "The opening days of the review period are reserved for setup. Reviewers report any issue that prevents them from starting, and authors are given a short window in which to correct it. Artifacts should not fail on setup problems."

    - step : "03"
      title : "Artifact evaluation"
      content : "A dedicated artifact evaluation committee executes the submissions. The review outcome and the artifact status are published together with the paper."

    - step : "04"
      title : "Stage one: presentation"
      content : "Accepted two-page submissions are discussed at the event, in three sessions each."

    - step : "05"
      title : "Stage two: full paper"
      content : "Written after the event and shepherded by a committee member, who confirms that the claims do not exceed the evidence that was reviewed. The full paper receives a DOI."
  button:
    enable : true
    label : "Read the full process"
    link : "/review"

