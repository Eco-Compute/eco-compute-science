######################### open questions #########################
open_questions:
  enable : true
  title : "What we are still deciding"
  subtitle : "This is a new venue and these questions are genuinely open. If you have an opinion, we would like to hear it before we fix the answers."
  items:
    - question : "How do we keep artifact review affordable?"
      content : "Artifact review is expensive. Options on the table: a cap on submissions, rolling reviews, one reviewer doing the initial setup and handing a working recipe to the others, and using AI assistance for the first reproduction pass."

    - question : "What do we do about confidential industry data?"
      content : "If a reviewer cannot see the data, reproducibility in the usual sense is out of reach, and synthetic sample data is often not realistic. A separate track with a lower reproducibility bar, a higher applicability bar and a required impact artifact is one idea."

    - question : "Single-blind or fully open?"
      content : "Artifacts are very hard to anonymise well. We need to decide whether to accept single-blind review or go fully open."

    - question : "How do we avoid no-shows in small groups?"
      content : "Free registration produces high no-show rates, which is fatal for capped discussion groups. A small fee, a three-sentence application, or a Dagstuhl-style invitation model are all being considered."

    - question : "Who sits on the committees?"
      content : "We are assembling a programme committee and an artifact evaluation committee. If you want to review, tell us."

