{{ define "main" }}

<section class="error section">
	<div class="container">
		<div class="row align-items-center">
			<div class="col-lg-6">
				<img src="{{`images/about/404-Error-Concept.webp` | absURL }}" alt="" class="img-fluid">
			</div>
			<div class="col-lg-6">
				<div class="error-content mt-5 mt-lg-0">
					<h3>Page not found</h3>
					<p class="mt-3">No page matches this address. Please try again with different keywords.</p>
					<a href="{{ .Site.BaseURL }}" class="btn btn-hero btn-rounded mt-3">Return to the home page</a>
				</div>
			</div>
		</div>
	</div>
</section>

{{ end }}
