######################## default configuration ####################
baseURL = "https://science.eco-compute.io/"
title = "ecoCompute Science 2027"
theme = "vixcon-hugo"
# post pagination
pagination.pagerSize = "4"
# post excerpt
summaryLength = "10"
# disable language
disableLanguages = [] # desable language from here

# nothing on this site uses tags or categories, and Hugo warns about the missing
# templates for them on every build
disableKinds = ["taxonomy", "term"]

# output
[outputs]
home = ["HTML", "RSS"]
section = ["HTML"]

[markup.goldmark.renderer]
unsafe = true

############################# Plugins ##############################
# CSS Plugins
[[params.plugins.css]]
link = "plugins/bootstrap/css/bootstrap.min.css"
[[params.plugins.css]]
link = "plugins/themefisher-font/themefisher-font.min.css"

# JS Plugins
[[params.plugins.js]]
link = "plugins/jquery/jquery.js"
[[params.plugins.js]]
link = "plugins/bootstrap/js/bootstrap.min.js"
[[params.plugins.js]]
link = "plugins/syotimer/syotimer.min.js"

############################## navigation ###############################
[menu]

  [[menu.main]]
  name = "About"
  URL = "/about"
  weight = 1

  [[menu.main]]
  name = "Call for Papers"
  URL = "/call-for-papers"
  weight = 2

  [[menu.main]]
  name = "Artifacts"
  URL = "/artifacts"
  weight = 3

  [[menu.main]]
  name = "Review & Publication"
  URL = "/review"
  weight = 4

  [[menu.main]]
  name = "More"
  hasChildren = true
  weight = 5

    [[menu.main]]
    name = "The event format"
    URL = "/#format"
    parent = "More"
    weight = 1

    [[menu.main]]
    name = "Organisers"
    URL = "/#organisers"
    parent = "More"
    weight = 2

    [[menu.main]]
    name = "FAQ"
    URL = "/faq"
    parent = "More"
    weight = 3

    [[menu.main]]
    name = "Code of Conduct"
    URL = "/code-of-conduct"
    parent = "More"
    weight = 4

    [[menu.main]]
    name = "Contact"
    URL = "/contact"
    parent = "More"
    weight = 5

    [[menu.main]]
    name = "ecoCompute conference archive"
    URL = "/previous-years"
    parent = "More"
    weight = 6


#################### default parameters ################################
[params]
logo = "images/logo-2.webp"
home = "Home"
# Meta data
description = "ecoCompute Science is a peer-reviewed, artifact-first venue for resource-aware computing. Every submission includes a runnable artifact, and the reviewers execute it."
author = "Green Coding Solutions GmbH"
# email address
email = "science@eco-compute.io"
# contact form action
contact_form_action = "#" # contact form works with https://formspree.io
# search for blog page
search = false
# analytics
plausible_domain = "science.eco-compute.io"
# short name used in meta tags and the navbar
short_title = "ecoCompute Science"

# Preloader
[params.preloader]
enable = true
preloader = "" # use jpg, png, svg or gif format.

# Navigation button
# off: the Call for Papers already has its own top level menu entry and a hero button
[params.navigation_button]
enable = false
label = "Call for Papers"
link = "/call-for-papers"

# Subscription
[params.subscription]
enable = false
mailchimp_form_action = ""
mailchimp_form_name = ""

# google map
[params.map]
enable = false




################################### English language #####################################
[Languages.en]
label = "En"
locale = "en-us"
contentDir = "content/english"
weight = 1

[Languages.en.params]
home = "Home"
# footer content
footer_content = "A peer-reviewed venue for resource-aware computing, in which the reviewers execute the artifact.<br>-<br><a href='/impressum'>Impressum</a> &middot; <a href='/datenschutz'>Datenschutz</a> &middot; <a href='/code-of-conduct'>Code of Conduct</a>"

# copyright
copyright = "Copyright &copy; 2026 Green Coding Solutions"

# image credit, required by the Magnific licence the hero photo is used under
# https://www.magnific.com/ai/docs/licenses-attribution
image_credit = "Hero image: <a href='https://www.magnific.com/'>Designed by Magnific</a>"
